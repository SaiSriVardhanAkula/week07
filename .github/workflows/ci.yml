name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  # =========================================================
  # Backend Tests
  # =========================================================
  backend-test:
    # KEEP YOUR EXISTING 7.1P BACKEND TEST CONFIGURATION HERE


  # =========================================================
  # Frontend Tests
  # =========================================================
  frontend-test:
    name: Test Frontend
    runs-on: ubuntu-latest

    env:
      VITE_USER_SERVICE_URL: http://localhost:8001
      VITE_STUDENT_SERVICE_URL: http://localhost:8002
      VITE_LECTURER_SERVICE_URL: http://localhost:8003
      VITE_COURSE_SERVICE_URL: http://localhost:8004
      VITE_ENROLLMENT_SERVICE_URL: http://localhost:8005

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        run: npx vitest run


  # =========================================================
  # Build and Push Docker Images
  # =========================================================
  build-and-push:
    name: Build and Push ${{ matrix.image }}
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-test

    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: frontend
            image: koalatech-frontend

          - service: user-service
            image: koalatech-user-service

          - service: student-service
            image: koalatech-student-service

          - service: lecturer-service
            image: koalatech-lecturer-service

          - service: course-service
            image: koalatech-course-service

          - service: enrollment-service
            image: koalatech-enrollment-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }} \
            -t ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:latest \
            ./${{ matrix.service }}

      - name: Push Docker image with commit SHA
        run: |
          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}

      - name: Push Docker image with latest tag
        run: |
          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:latest